<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بقالة | سوق الخدمات المحلية</title><meta name="description" content="اكتشف محترفين بالقرب منك واحجز الخدمات المحلية بثقة"><style>:root{--ink:#14231f;--muted:#687672;--g:#08745b;--mint:#eaf7f2;--soft:#f5f8f6;--line:#e1e9e5}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;color:var(--ink);line-height:1.7}a{text-decoration:none;color:inherit}.shell{width:min(1150px,calc(100% - 30px));margin:auto}.header{height:74px;position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#14a47c,var(--g));color:#fff;display:grid;place-items:center;font-size:24px}.links,.actions{display:flex;gap:18px;align-items:center}.links a{font-size:12px;font-weight:700}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;justify-content:center}.primary{background:var(--g);color:#fff}.softBtn{background:var(--mint);color:var(--g)}.hero{padding:75px 0;background:linear-gradient(#fbfdfc,#f3faf7)}.heroGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center}.eyebrow{color:var(--g);font-size:11px;font-weight:900}.hero h1{font-size:clamp(44px,6vw,72px);line-height:1.08;margin:15px 0}.hero h1 em{font-style:normal;color:var(--g)}.hero p{color:var(--muted);font-size:16px}.search{display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:0 16px 45px #123c3114;margin-top:24px}.search input{flex:1;border:0;outline:0;padding:13px;font:inherit}.art{height:410px;border-radius:32px;background:linear-gradient(135deg,#dceee7,#cde5dc);position:relative;overflow:hidden;box-shadow:0 35px 80px #0a453719}.art:after{content:"";position:absolute;inset:-70px;background-image:linear-gradient(#ffffff66 1px,transparent 1px),linear-gradient(90deg,#ffffff66 1px,transparent 1px);background-size:60px 60px;transform:rotate(12deg)}.pin{position:absolute;z-index:2;width:50px;height:50px;border-radius:16px 16px 16px 4px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:21px}.p1{top:90px;right:100px}.p2{bottom:95px;left:90px;background:#5d55a5}.float{position:absolute;z-index:3;background:#fff;border-radius:15px;padding:12px 15px;box-shadow:0 14px 35px #123c3122;display:flex;flex-direction:column}.f1{top:45px;left:24px}.f2{bottom:30px;right:25px}.float small,.muted{color:var(--muted);font-size:9px}.section,.page{padding:70px 0}.section h2,.page h1{font-size:clamp(30px,4vw,42px);margin:6px 0 25px}.cats,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.cat,.card,.panel{border:1px solid var(--line);border-radius:17px;background:#fff}.cat{padding:17px;display:flex;align-items:center;gap:11px}.cat i{width:44px;height:44px;border-radius:12px;background:var(--mint);color:var(--g);display:grid;place-items:center;font-style:normal}.card{overflow:hidden}.visual{height:150px;background:linear-gradient(135deg,#e4f2ed,#d5e8e0);display:grid;place-items:center;font-size:36px;color:var(--g)}.body,.panel{padding:18px}.body small{color:var(--muted);font-size:9px}.body b{display:block;font-size:14px;margin:5px 0}.foot{border-top:1px solid #edf2ef;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-size:9px}.soft{background:var(--soft)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}.field label{font-size:9px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid #dce5e1;border-radius:10px;padding:11px;font:inherit}.field textarea{min-height:100px}.login{width:min(470px,100%);margin:0 auto}.error{background:#fff0f0;color:#94363c;padding:9px;border-radius:9px;margin:8px 0}.success{background:var(--mint);color:#08614b;padding:9px;border-radius:9px;margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{border:1px solid var(--line);border-radius:14px;padding:15px}.metric small{color:var(--muted)}.metric b{display:block;font-size:24px}.row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.row>div{display:flex;flex-direction:column}.row small{font-size:9px;color:var(--muted)}.status{font-size:8px;background:var(--soft);border-radius:7px;padding:4px 7px;width:max-content}.empty{text-align:center;padding:45px;color:var(--muted)}footer{background:#111f1b;color:#d4dfdb;padding:35px 0;margin-top:50px}.footer{display:flex;justify-content:space-between;font-size:9px;color:#84958f}@media(max-width:900px){.links{display:none}.heroGrid{grid-template-columns:1fr}.art{height:300px}.cats,.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{width:calc(100% - 24px)}.actions .softBtn{display:none}.hero{padding:45px 0}.hero h1{font-size:43px}.search{flex-direction:column}.cats,.cards,.grid2{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><header class="header"><div class="shell nav"><a class="logo" href="/" data-nav><span class="mark">ب</span>بقالة</a><nav class="links"><a href="/services" data-nav>استكشف الخدمات</a><a href="/provider" data-nav>قدّم خدماتك</a><a href="/dashboard" data-nav>طلباتي</a></nav><div class="actions" id="auth"></div></div></header><main id="app"></main><footer><div class="shell footer"><span>© 2026 بقالة — Yahya Alnaggar</span><span>خدمات محلية · حجوزات موثوقة · تقييمات حقيقية</span></div></footer><script>const A='/api',root=document.getElementById('app');let me=null;async function api(p,o={}){const r=await fetch(A+p,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'تعذر تنفيذ الطلب');return b}async function who(){try{me=await api('/auth/me')}catch{me=null}document.getElementById('auth').innerHTML=me?`<a class="btn softBtn" href="${me.role==='admin'?'/admin':me.role==='provider'?'/provider':'/dashboard'}" data-nav>لوحتي</a><button class="btn primary" id="logout">خروج</button>`:'<a class="btn softBtn" href="/auth" data-nav>دخول</a><a class="btn primary" href="/auth?mode=register" data-nav>إنشاء حساب</a>';bind();document.getElementById('logout')?.addEventListener('click',async()=>{await api('/auth/logout',{method:'POST'});location.href='/'})}function bind(){document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();history.pushState({},'',a.getAttribute('href'));render()})}const cash=v=>v==null?'حسب الاتفاق':Number(v).toLocaleString('ar-YE')+' ر.ي';function cards(s){return s.length?'<div class="cards">'+s.map(x=>`<a class="card" href="/service/${x.id}" data-nav><div class="visual">✦</div><div class="body"><small>${x.category}</small><b>${x.title}</b><small>${x.provider_name}${x.verified?' ✓':''}</small><div class="foot"><span>★ ${Number(x.rating||0).toFixed(1)}</span><strong>${cash(x.price)}</strong></div></div></a>`).join('')+'</div>':'<div class="empty">لا توجد خدمات منشورة بعد.</div>'}async function home(){const[c,s]=await Promise.all([api('/categories'),api('/services')]);root.innerHTML=`<section class="hero"><div class="shell heroGrid"><div><span class="eyebrow">سوق خدمات محلي موثوق</span><h1>المهارة التي تحتاجها.<br><em>أقرب مما تتخيل.</em></h1><p>ابحث عن محترفين قريبين منك، قارن الأسعار والتقييمات، احجز الموعد وتابع الخدمة من مكان واحد.</p><form class="search" id="search"><input name="q" placeholder="ما الخدمة التي تبحث عنها؟"><input name="city" placeholder="المدينة"><button class="btn primary">ابحث الآن</button></form></div><div class="art"><span class="pin p1">⚡</span><span class="pin p2">✦</span><div class="float f1"><b>محترف قريب منك</b><small>★ تقييمات من خدمات مكتملة</small></div><div class="float f2"><b>حجز أكثر ثقة</b><small>منع تضارب المواعيد</small></div></div></div></section><section class="section shell"><span class="eyebrow">استكشف حسب احتياجك</span><h2>خدمات لكل يوم، وكل مشروع</h2><div class="cats">${c.map(x=>`<a class="cat" href="/services?category=${x.slug}" data-nav><i>${x.icon}</i><b>${x.name}</b></a>`).join('')}</div></section><section class="section soft"><div class="shell"><span class="eyebrow">أحدث الخدمات</span><h2>اكتشف ما يناسبك</h2>${cards(s)}</div></section>`;document.getElementById('search').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);history.pushState({},'',`/services?q=${encodeURIComponent(f.get('q'))}&city=${encodeURIComponent(f.get('city'))}`);render()};bind()}async function services(){const s=await api('/services?'+new URLSearchParams(location.search));root.innerHTML=`<section class="page shell"><span class="eyebrow">السوق المحلي</span><h1>استكشف الخدمات</h1>${cards(s)}</section>`;bind()}async function detail(id){const x=await api('/services/'+id);root.innerHTML=`<section class="page shell"><div class="grid2"><article class="panel"><span class="eyebrow">${x.category}</span><h1>${x.title}</h1><p>${x.description}</p><p><b>${x.provider_name}</b> ${x.verified?'✓ موثّق':''} · ${x.city}</p></article><aside class="panel"><span class="eyebrow">سعر الخدمة</span><h2>${cash(x.price)}</h2><button class="btn primary" id="book">احجز الخدمة</button><p class="muted">السعر يثبّت من الخادم ولا يرسله العميل.</p></aside></div></section>`;document.getElementById('book').onclick=()=>{if(!me){history.pushState({},'','/auth');return render()}booking(x)}}function booking(x){root.innerHTML=`<section class="page shell"><form class="panel login" id="book"><span class="eyebrow">طلب خدمة</span><h1>${x.title}</h1><div class="field"><label>التاريخ والوقت</label><input name="startsAt" type="datetime-local" required></div><div class="field"><label>الموقع</label><input name="location"></div><div class="field"><label>صف ما تحتاجه</label><textarea name="description" required></textarea></div><div id="msg"></div><button class="btn primary">إرسال طلب الحجز</button></form></section>`;document.getElementById('book').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/bookings',{method:'POST',body:JSON.stringify({serviceId:x.id,startsAt:new Date(f.get('startsAt')).toISOString(),location:f.get('location'),description:f.get('description')})});history.pushState({},'','/dashboard');render()}catch(z){document.getElementById('msg').innerHTML='<div class="error">'+z.message+'</div>'}}}function auth(){const reg=new URLSearchParams(location.search).get('mode')==='register';root.innerHTML=`<section class="page shell"><form class="panel login" id="authForm"><span class="eyebrow">${reg?'ابدأ من هنا':'مرحبًا بعودتك'}</span><h1>${reg?'إنشاء حساب':'تسجيل الدخول'}</h1>${reg?'<div class="field"><label>الاسم</label><input name="name" required></div><div class="field"><label>المدينة</label><input name="city"></div>':''}<div class="field"><label>البريد</label><input name="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" minlength="10" required></div><div id="msg"></div><button class="btn primary">${reg?'إنشاء الحساب':'دخول'}</button></form></section>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();try{await api('/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target))) });await who();history.pushState({},'','/dashboard');render()}catch(z){document.getElementById('msg').innerHTML='<div class="error">'+z.message+'</div>'}}}async function dashboard(){if(!me){history.pushState({},'','/auth');return auth()}const b=await api('/bookings');root.innerHTML=`<section class="page shell"><span class="eyebrow">حسابك</span><h1>طلباتي</h1><div class="metrics"><div class="metric"><small>كل الطلبات</small><b>${b.length}</b></div><div class="metric"><small>المكتملة</small><b>${b.filter(x=>x.status==='COMPLETED').length}</b></div></div><div class="panel">${b.length?b.map(x=>`<div class="row"><div><span class="status">${x.status}</span><b>${x.service_title}</b><small>${x.provider_name} · ${cash(x.price)}</small></div><div id="act${x.id}"></div></div>`).join(''):'<div class="empty">لا توجد حجوزات بعد.</div>'}</div></section>`;b.forEach(x=>{const d=document.getElementById('act'+x.id);if(!d)return;if(me.role==='provider'){const n=x.status==='PENDING'?'ACCEPTED':x.status==='ACCEPTED'?'CONFIRMED':x.status==='CONFIRMED'?'IN_PROGRESS':x.status==='IN_PROGRESS'?'COMPLETED':null;if(n)d.innerHTML=`<button class="btn primary" data-id="${x.id}" data-status="${n}">${n}</button>`}else if(['PENDING','ACCEPTED','CONFIRMED'].includes(x.status))d.innerHTML=`<button class="btn softBtn" data-id="${x.id}" data-status="CANCELLED">إلغاء</button>`});document.querySelectorAll('[data-status]').forEach(x=>x.onclick=async()=>{try{await api('/bookings/'+x.dataset.id+'/status',{method:'PATCH',body:JSON.stringify({status:x.dataset.status})});render()}catch(z){alert(z.message)}})}async function provider(){if(!me){history.pushState({},'','/auth');return auth()}if(me.role!=='provider'){root.innerHTML='<section class="page shell"><form class="panel login" id="onboard"><span class="eyebrow">قدّم خدماتك</span><h1>أنشئ ملف مقدم الخدمة</h1><div class="field"><label>المسمى المهني</label><input name="title" required></div><div class="field"><label>نبذة</label><textarea name="bio"></textarea></div><div class="field"><label>المدينة</label><input name="city" required></div><div class="field"><label>المنطقة</label><input name="district"></div><button class="btn primary">إنشاء الملف</button></form></section>';document.getElementById('onboard').onsubmit=async e=>{e.preventDefault();await api('/provider/onboard',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await who();render()};return}const[c,b]=await Promise.all([api('/categories'),api('/bookings')]);root.innerHTML=`<section class="page shell"><span class="eyebrow">مقدم الخدمة</span><h1>إدارة أعمالك</h1><div class="grid2"><div class="panel"><h2>الحجوزات</h2>${b.map(x=>`<div class="row"><div><b>${x.service_title}</b><small>${x.status} · ${x.customer_name}</small></div></div>`).join('')}</div><form class="panel" id="svc"><h2>إضافة خدمة</h2><div class="field"><label>العنوان</label><input name="title" required></div><div class="field"><label>التصنيف</label><select name="category">${c.map(x=>`<option value="${x.slug}">${x.name}</option>`).join('')}</select></div><div class="field"><label>الوصف</label><textarea name="description" required></textarea></div><div class="field"><label>السعر</label><input name="price" type="number"></div><button class="btn primary">نشر الخدمة</button></form></div></section>`;document.getElementById('svc').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.price=Number(f.price||0);await api('/services',{method:'POST',body:JSON.stringify(f)});alert('تم نشر الخدمة');e.target.reset()}}async function admin(){if(!me||me.role!=='admin'){history.pushState({},'','/auth');return auth()}const s=await api('/admin/stats');root.innerHTML=`<section class="page shell"><span class="eyebrow">الإدارة</span><h1>مركز تشغيل بقالة</h1><div class="metrics">${Object.entries(s).map(([k,v])=>`<div class="metric"><small>${k}</small><b>${v}</b></div>`).join('')}</div><div class="panel"><b>بيئة النشر المباشر تعمل.</b><p class="muted">الإدارة الموسعة والتوثيق والمدفوعات والـLedger موجودة في حزمة المصدر الكاملة للإصدار.</p></div></section>`}async function render(){await who();const p=location.pathname;if(p==='/')return home();if(p==='/services')return services();if(p.startsWith('/service/'))return detail(p.split('/')[2]);if(p==='/auth')return auth();if(p==='/dashboard')return dashboard();if(p==='/provider')return provider();if(p==='/admin')return admin();return home()}window.onpopstate=render;render();</script></body></html>
