<footer class="footer"><div class="shell"><div class="footerGrid"><div><a class="logo" href="/" data-nav><span class="mark">ب</span>بقالة</a><p>سوق محلي للخدمات يقرّبك من أصحاب المهارات في مدينتك، من البحث حتى إتمام الخدمة والتقييم.</p></div><div><h4>اكتشف</h4><a href="/services" data-nav>الخدمات</a><br><a href="/providers" data-nav>مقدمو الخدمات</a></div><div><h4>حسابك</h4><a href="/dashboard" data-nav>الحجوزات</a><br><a href="/favorites" data-nav>المفضلة</a></div><div><h4>الثقة</h4><a href="/provider" data-nav>قدّم خدماتك</a><br><span style="font-size:10px;color:#93a49d">التقييم بعد خدمة مكتملة فقط</span></div></div><div class="copyright"><span>© 2026 بقالة — Yahya Alnaggar</span><span>الإصدار التشغيلي 1.2</span></div></div></footer>
<script>
const A='/api',root=document.getElementById('app');let me=null,chatTimer=null,favorites=new Set();
const STATUS={PENDING:'قيد الانتظار',ACCEPTED:'مقبول',REJECTED:'مرفوض',CONFIRMED:'مؤكد',IN_PROGRESS:'قيد التنفيذ',COMPLETED:'مكتمل',CANCELLED:'ملغي'};
const ERR={AUTH_REQUIRED:'سجّل الدخول أولاً.',INVALID_CREDENTIALS:'بيانات الدخول غير صحيحة.',ACCOUNT_EXISTS:'يوجد حساب بهذا البريد.',ACCOUNT_NOT_ACTIVE:'الحساب غير نشط حالياً.',INVALID_INPUT:'تحقق من البيانات المدخلة.',SERVICE_NOT_FOUND:'الخدمة غير متاحة.',OWN_SERVICE:'لا يمكنك حجز خدمتك الخاصة.',SLOT_UNAVAILABLE:'الموعد غير متاح، اختر وقتاً آخر.',PROVIDER_UNAVAILABLE:'مقدم الخدمة غير متاح في هذا التاريخ.',OUTSIDE_WORKING_DAYS:'هذا اليوم خارج أيام عمل مقدم الخدمة.',OUTSIDE_WORKING_HOURS:'الوقت المختار خارج ساعات العمل.',REVIEW_REQUIRES_COMPLETED_BOOKING:'يمكن التقييم بعد اكتمال الخدمة فقط.',ALREADY_REVIEWED:'تم تقييم هذا الحجز مسبقاً.',VERIFICATION_ALREADY_PENDING:'يوجد طلب توثيق قيد المراجعة.',DISPUTE_NOT_ALLOWED:'لا يمكن فتح نزاع في حالة الحجز الحالية.',DISPUTE_ALREADY_EXISTS:'يوجد نزاع مرتبط بهذا الحجز.',FORBIDDEN:'ليست لديك صلاحية لهذه العملية.',PROVIDER_REQUIRED:'يجب إنشاء ملف مقدم خدمة أولاً.',INTERNAL_ERROR:'حدث خطأ غير متوقع. حاول مرة أخرى.'};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const cash=v=>v==null?'حسب الاتفاق':Number(v).toLocaleString('ar-YE')+' ر.ي';
const date=v=>new Intl.DateTimeFormat('ar-YE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));
const shortDate=v=>new Intl.DateTimeFormat('ar-YE',{dateStyle:'medium'}).format(new Date(v));
const stars=v=>'★'.repeat(Math.round(Number(v)||0))+'☆'.repeat(5-Math.round(Number(v)||0));
function toast(msg,bad=false){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
async function api(p,o={}){const r=await fetch(A+p,{credentials:'same-origin',...o,headers:{'content-type':'application/json',...(o.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(ERR[b.error]||b.error||'تعذر تنفيذ الطلب');e.code=b.error;throw e}return b}
async function loadIdentity(){try{me=await api('/auth/me');try{favorites=new Set(await api('/favorites/ids'))}catch{favorites=new Set()}}catch{me=null;favorites=new Set()}renderChrome()}
function renderChrome(){const box=document.getElementById('authActions');if(me){box.innerHTML=`<a class="iconBtn" href="/notifications" data-nav title="الإشعارات">◔</a><a class="btn secondary userBtn" href="${me.role==='admin'?'/admin':me.role==='provider'?'/provider':'/dashboard'}" data-nav>${esc(me.name.split(' ')[0])}</a><button class="btn ghost tiny" id="logout">خروج</button>`}else{box.innerHTML='<a class="btn secondary" href="/auth" data-nav>دخول</a><a class="btn primary" href="/auth?mode=register" data-nav>إنشاء حساب</a>'}document.getElementById('logout')?.addEventListener('click',async()=>{await api('/auth/logout',{method:'POST'});me=null;favorites.clear();go('/')});renderMobile();bindNav()}
function renderMobile(){const n=document.getElementById('mobileNav'),p=location.pathname;const items=[['/','⌂','الرئيسية'],['/services','⌕','استكشف'],[me?'/dashboard':'/auth','▣','طلباتي'],[me?'/favorites':'/auth','♡','المفضلة'],[me?(me.role==='provider'?'/provider':me.role==='admin'?'/admin':'/profile'):'/auth','◎','حسابي']];n.innerHTML=items.map(([h,i,t])=>`<a href="${h}" data-nav class="${p===h||(h!=='/'&&p.startsWith(h))?'active':''}"><span>${i}</span>${t}</a>`).join('');bindNav()}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))})}
function go(path){history.pushState({},'',path);render()}
function modal(title,body){const d=document.createElement('div');d.className='modalBack';d.innerHTML=`<div class="modal"><div class="modalHead"><h2>${esc(title)}</h2><button class="close">×</button></div>${body}</div>`;document.body.appendChild(d);d.querySelector('.close').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};return d}
function serviceCards(list){if(!list.length)return `<div class="empty"><span class="emptyIcon">⌕</span>لا توجد نتائج مطابقة حالياً.<br><small>جرّب تغيير المدينة أو التصنيف أو السعر.</small></div>`;return `<div class="cards">${list.map(x=>`<article class="card"><button class="fav ${favorites.has(x.id)?'active':''}" data-fav="${x.id}" aria-label="المفضلة">${favorites.has(x.id)?'♥':'♡'}</button><a href="/service/${x.id}" data-nav><div class="visual"><span>${iconFor(x.category)}</span></div><div class="cardBody"><span class="kicker">${esc(categoryName(x.category))}</span><span class="cardTitle">${esc(x.title)}</span><div class="providerLine"><span>${esc(x.provider_name)}</span>${x.verified?'<span class="verify">✓ موثّق</span>':''}<span>· ${esc(x.city||'')}</span></div><div class="cardFoot"><span><span style="color:#d49a20">★</span> ${Number(x.rating||0).toFixed(1)} <span style="color:#89958f">(${x.rating_count||0})</span></span><span class="price">${cash(x.price)}</span></div></div></a></article>`).join('')}</div>`}
const CAT={home:'صيانة المنازل',electrical:'الكهرباء',plumbing:'السباكة',design:'التصميم والإبداع',tech:'الخدمات التقنية',education:'التعليم والدروس',business:'خدمات الأعمال',cars:'خدمات السيارات',events:'خدمات المناسبات',cleaning:'التنظيف',photo:'التصوير والمونتاج',translation:'الترجمة والكتابة'};
const ICON={home:'⌂',electrical:'⚡',plumbing:'◌',design:'✦',tech:'⌘',education:'⌁',business:'▥',cars:'◉',events:'◇',cleaning:'✧',photo:'◍',translation:'文'};
const categoryName=x=>CAT[x]||x,iconFor=x=>ICON[x]||'✦';
function bindFav(){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();if(!me)return go('/auth');const id=b.dataset.fav;try{if(favorites.has(id)){await api('/favorites/'+id,{method:'DELETE'});favorites.delete(id);b.classList.remove('active');b.textContent='♡'}else{await api('/favorites/'+id,{method:'POST'});favorites.add(id);b.classList.add('active');b.textContent='♥'}toast(favorites.has(id)?'أضيفت إلى المفضلة':'أزيلت من المفضلة')}catch(z){toast(z.message,true)}})}
async function home(){const[c,s,stats,providers]=await Promise.all([api('/categories'),api('/services'),api('/public/stats'),api('/providers?verified=true')]);root.innerHTML=`<section class="hero"><div class="shell heroGrid"><div><span class="eyebrow">سوق الخدمات المحلي</span><h1>احتياجك اليومي.<br><em>بيد محترف قريب منك.</em></h1><p class="heroLead">من الصيانة والتصميم إلى التعليم والخدمات التقنية — اكتشف، قارن واحجز مقدم الخدمة المناسب بدون اتصالات عشوائية أو بحث طويل.</p><form class="searchBox" id="heroSearch"><input name="q" aria-label="الخدمة" placeholder="ابحث: كهربائي، مصمم، مدرس..."><input name="city" aria-label="المدينة" placeholder="المدينة"><button class="btn primary">ابحث الآن ←</button></form><div class="trustRow"><span><i class="check">✓</i> تقييم بعد خدمة مكتملة</span><span><i class="check">✓</i> حجز موثق داخل المنصة</span><span><i class="check">✓</i> خصوصية الموقع</span></div></div><div class="heroVisual"><div class="mapArt"><div class="road"></div><span class="pin one">⚡</span><span class="pin two">✦</span><span class="pin three">⌘</span><div class="floatCard a"><div class="avatarLine"><span class="avatar">م</span><div><b>مقدم خدمة قريب</b><small>تقييمات موثوقة من حجوزات حقيقية</small></div></div></div><div class="floatCard b"><b>موعدك محفوظ</b><small>منع الحجز المزدوج للمواعيد المقبولة</small></div></div></div></div></section><section class="statsStrip"><div class="shell statsGrid"><div class="stat"><b>${stats.services||0}</b><small>خدمة منشورة</small></div><div class="stat"><b>${stats.providers||0}</b><small>مقدم خدمة</small></div><div class="stat"><b>${stats.completed||0}</b><small>خدمة مكتملة</small></div><div class="stat"><b>${Number(stats.rating||0).toFixed(1)} ★</b><small>متوسط التقييم</small></div></div></section><section class="section shell"><div class="sectionHead"><div><span class="eyebrow">ابدأ من التصنيف</span><h2>كل ما تحتاجه، في مكان واحد</h2></div><p>التصنيفات مرنة، ويمكن للمنصة إضافة خدمات وتخصصات جديدة دون تغيير جوهري في النظام.</p></div><div class="cats">${c.map(x=>`<a class="cat" href="/services?category=${encodeURIComponent(x.slug)}" data-nav><i>${x.icon}</i><div><b>${esc(x.name)}</b><small>اعرض مقدمي الخدمة</small></div></a>`).join('')}</div></section><section class="section softSec"><div class="shell"><div class="sectionHead"><div><span class="eyebrow">خدمات أضيفت حديثاً</span><h2>اكتشف فرصة أفضل لخدمتك</h2></div><a class="btn ghost" href="/services" data-nav>عرض جميع الخدمات</a></div>${serviceCards(s.slice(0,6))}</div></section>${providers.length?`<section class="section shell"><div class="sectionHead"><div><span class="eyebrow">الثقة أولاً</span><h2>مقدمو خدمات موثّقون</h2></div><a class="btn ghost" href="/providers?verified=true" data-nav>عرض المزيد</a></div><div class="grid3">${providers.slice(0,3).map(p=>providerMini(p)).join('')}</div></section>`:''}<section class="section darkSec"><div class="shell"><div class="sectionHead"><div><span class="eyebrow">كيف تعمل بقالة؟</span><h2>ثلاث خطوات من البحث إلى الإنجاز</h2></div></div><div class="steps"><div class="step"><span class="stepNo">01</span><h3>اكتشف وقارن</h3><p>ابحث حسب الخدمة والمدينة والسعر والتقييم وحالة التوثيق.</p></div><div class="step"><span class="stepNo">02</span><h3>احجز وتواصل</h3><p>حدد الموعد، اكتب تفاصيل الطلب وتواصل مع مقدم الخدمة داخل الحجز.</p></div><div class="step"><span class="stepNo">03</span><h3>أكمل وقيّم</h3><p>بعد إنجاز الخدمة يصبح الحجز مؤهلاً للتقييم، ولا نقبل تقييمات بلا خدمة مكتملة.</p></div></div></div></section><section class="section shell"><div class="cta"><div><h2>لديك مهارة مطلوبة في مدينتك؟</h2><p>أنشئ ملفك، أضف خدماتك، حدد أوقاتك واستقبل طلبات العملاء.</p></div><a class="btn primary" href="/provider" data-nav>ابدأ كمقدم خدمة</a></div></section>`;document.getElementById('heroSearch').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),q=new URLSearchParams();if(f.get('q'))q.set('q',f.get('q'));if(f.get('city'))q.set('city',f.get('city'));go('/services?'+q)};bindNav();bindFav()}
function providerMini(p){return `<a class="panel" href="/provider-profile/${p.id}" data-nav><div class="providerCard" style="border:0;margin:0;padding:0"><span class="providerAvatar">${esc((p.name||'م').slice(0,1))}</span><div><b style="font-size:13px">${esc(p.name)}</b>${p.verified?' <span class="verify">✓</span>':''}<small style="display:block;color:var(--sub);font-size:9px">${esc(p.title)} · ${esc(p.city)}</small></div></div><div style="display:flex;gap:8px;margin-top:13px"><span class="pill">★ ${Number(p.rating||0).toFixed(1)}</span><span class="pill gray">${p.completed||0} مكتملة</span><span class="pill gray">${p.service_count||0} خدمات</span></div></a>`}
async function services(){const q=new URLSearchParams(location.search),[c,s]=await Promise.all([api('/categories'),api('/services?'+q)]);root.innerHTML=`<section class="page shell"><span class="eyebrow">استكشف السوق</span><h1>اعثر على الخدمة المناسبة</h1><div class="filterGrid"><form class="filters" id="filters"><h3>تصفية النتائج</h3><div class="field"><label>الكلمة المفتاحية</label><input name="q" value="${esc(q.get('q')||'')}" placeholder="اسم الخدمة أو مقدمها"></div><div class="field"><label>المدينة</label><input name="city" value="${esc(q.get('city')||'')}" placeholder="مثال: صنعاء"></div><div class="field"><label>التصنيف</label><select name="category"><option value="">كل التصنيفات</option>${c.map(x=>`<option value="${esc(x.slug)}" ${q.get('category')===x.slug?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>أقل سعر</label><input name="minPrice" type="number" value="${esc(q.get('minPrice')||'')}"></div><div class="field"><label>أعلى سعر</label><input name="maxPrice" type="number" value="${esc(q.get('maxPrice')||'')}"></div></div><label class="checkField"><input type="checkbox" name="verified" ${q.get('verified')==='true'?'checked':''}> مقدمو خدمات موثّقون فقط</label><div class="field"><label>ترتيب النتائج</label><select name="sort"><option value="">الأحدث</option><option value="rating" ${q.get('sort')==='rating'?'selected':''}>الأعلى تقييماً</option><option value="price_low" ${q.get('sort')==='price_low'?'selected':''}>الأقل سعراً</option><option value="price_high" ${q.get('sort')==='price_high'?'selected':''}>الأعلى سعراً</option></select></div><button class="btn primary" style="width:100%">تطبيق الفلاتر</button><button type="button" class="btn ghost" id="clear" style="width:100%;margin-top:7px">مسح</button></form><div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><small style="color:var(--sub)">${s.length} نتيجة</small></div>${serviceCards(s)}</div></div></section>`;document.getElementById('filters').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n=new URLSearchParams();for(const[k,v]of f){if(k==='verified'){n.set('verified','true')}else if(v)n.set(k,v)}go('/services?'+n)};document.getElementById('clear').onclick=()=>go('/services');bindNav();bindFav()}
async function providers(){const q=new URLSearchParams(location.search),p=await api('/providers?'+q);root.innerHTML=`<section class="page shell"><span class="eyebrow">دليل المحترفين</span><h1>مقدمو الخدمات</h1><form class="toolbar" id="psearch"><input name="q" value="${esc(q.get('q')||'')}" placeholder="الاسم أو التخصص"><input name="city" value="${esc(q.get('city')||'')}" placeholder="المدينة"><label class="checkField"><input name="verified" type="checkbox" ${q.get('verified')==='true'?'checked':''}> موثّق فقط</label><button class="btn primary">بحث</button></form>${p.length?`<div class="grid3">${p.map(providerMini).join('')}</div>`:`<div class="empty"><span class="emptyIcon">◎</span>لا يوجد مقدمو خدمات مطابقون.</div>`}</section>`;document.getElementById('psearch').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n=new URLSearchParams();if(f.get('q'))n.set('q',f.get('q'));if(f.get('city'))n.set('city',f.get('city'));if(f.get('verified'))n.set('verified','true');go('/providers?'+n)};bindNav()}
async function providerProfile(id){const p=await api('/providers/'+id);root.innerHTML=`<section class="page shell"><div class="grid2"><div class="panel"><div class="providerCard" style="border:0;margin:0;padding:0"><span class="providerAvatar" style="width:70px;height:70px;font-size:25px">${esc(p.name.slice(0,1))}</span><div><span class="eyebrow">مقدم خدمة</span><h1 style="font-size:31px;margin:3px 0">${esc(p.name)} ${p.verified?'<span class="verify">✓</span>':''}</h1><p style="margin:0;color:var(--sub);font-size:12px">${esc(p.title)} · ${esc(p.city)} ${p.district?'· '+esc(p.district):''}</p></div></div><p class="serviceDesc" style="margin-top:20px">${esc(p.bio||'لم يضف مقدم الخدمة نبذة بعد.')}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">★ ${Number(p.rating||0).toFixed(1)} (${p.rating_count||0})</span><span class="pill gray">${p.completed||0} خدمة مكتملة</span>${p.verified?'<span class="pill">موثّق</span>':'<span class="pill gray">غير موثّق</span>'}</div></div><div class="panel"><h3>معلومات سريعة</h3><div class="row"><span>المدينة</span><b>${esc(p.city)}</b></div><div class="row"><span>المنطقة</span><b>${esc(p.district||'غير محددة')}</b></div><div class="row"><span>الخدمات المنشورة</span><b>${p.services.length}</b></div></div></div><div class="sectionHead" style="margin-top:35px"><div><span class="eyebrow">خدماته</span><h2>الخدمات المتاحة</h2></div></div>${serviceCards(p.services.map(s=>({...s,provider_name:p.name,city:p.city,verified:p.verified,rating:p.rating,rating_count:p.rating_count})))}<div class="panel reviews" style="margin-top:24px"><h3>آخر التقييمات</h3>${reviewsHtml(p.reviews)}</div></section>`;bindNav();bindFav()}
function reviewsHtml(r){return r?.length?r.map(x=>`<div class="review"><div class="stars">${stars(x.rating)}</div><p>${esc(x.comment||'تقييم بدون تعليق')}</p><small>${esc(x.customer_name)} · ${shortDate(x.created_at)}</small></div>`).join(''):`<div class="empty">لا توجد تقييمات بعد.</div>`}
async function serviceDetail(id){const x=await api('/services/'+id);root.innerHTML=`<section class="page shell"><div class="serviceHero"><article class="panel serviceMain"><span class="eyebrow">${esc(categoryName(x.category))}</span><h1>${esc(x.title)}</h1><div class="serviceMeta"><span>★ ${Number(x.rating||0).toFixed(1)} (${x.rating_count||0} تقييم)</span><span>◎ ${esc(x.city)} ${x.district?'· '+esc(x.district):''}</span><span>◷ ${x.duration||60} دقيقة تقريباً</span><span>${x.location_type==='ONLINE'?'عبر الإنترنت':x.location_type==='PROVIDER_LOCATION'?'في موقع مقدم الخدمة':x.location_type==='HYBRID'?'مرن':'في موقع العميل'}</span></div><h3>عن الخدمة</h3><p class="serviceDesc">${esc(x.description)}</p><a class="providerCard" href="/provider-profile/${x.provider_id}" data-nav><span class="providerAvatar">${esc(x.provider_name.slice(0,1))}</span><div><b>${esc(x.provider_name)} ${x.verified?'<span class="verify">✓ موثّق</span>':''}</b><small style="display:block;color:var(--sub);font-size:9px">${esc(x.provider_title)} · ${x.completed||0} خدمة مكتملة</small></div></a><div class="reviews"><h3>التقييمات</h3>${reviewsHtml(x.reviews)}</div></article><aside class="panel bookingCard"><span class="kicker">${esc(x.pricing==='FIXED'?'سعر ثابت':x.pricing==='HOURLY'?'بالساعة':x.pricing==='NEGOTIABLE'?'قابل للتفاوض':'يبدأ من')}</span><div class="bigPrice">${cash(x.price)}</div><button class="btn primary" id="book" style="width:100%">احجز هذه الخدمة</button><button class="btn ${favorites.has(x.id)?'danger':'ghost'}" id="favDetail" style="width:100%;margin-top:8px">${favorites.has(x.id)?'♥ محفوظة في المفضلة':'♡ أضف إلى المفضلة'}</button><div class="note">السعر الظاهر يؤخذ من الخادم عند إنشاء الحجز، ولا يستطيع العميل تعديله من الطلب.</div></aside></div></section>`;document.getElementById('book').onclick=()=>me?openBooking(x):go('/auth?next=/service/'+x.id);document.getElementById('favDetail').onclick=async()=>{if(!me)return go('/auth');try{if(favorites.has(x.id)){await api('/favorites/'+x.id,{method:'DELETE'});favorites.delete(x.id)}else{await api('/favorites/'+x.id,{method:'POST'});favorites.add(x.id)}serviceDetail(x.id)}catch(z){toast(z.message,true)}};bindNav()}
function openBooking(x){const m=modal('احجز '+x.title,`<form id="bookForm"><div class="field"><label>التاريخ والوقت</label><input name="startsAt" type="datetime-local" required></div><div class="field"><label>موقع تنفيذ الخدمة</label><input name="location" placeholder="الحي أو وصف الموقع"></div><div class="field"><label>صف ما تحتاجه</label><textarea name="description" required minlength="10" placeholder="اكتب تفاصيل كافية لمقدم الخدمة..."></textarea></div><div class="note">مدة الحجز المقدرة ${x.duration||60} دقيقة. سيتم التحقق من التوفر وتعارض المواعيد عند الإرسال.</div><button class="btn primary" style="width:100%">إرسال طلب الحجز</button></form>`);m.querySelector('#bookForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/bookings',{method:'POST',body:JSON.stringify({serviceId:x.id,startsAt:new Date(f.get('startsAt')).toISOString(),location:f.get('location'),description:f.get('description')})});m.remove();toast('تم إرسال طلب الحجز');go('/dashboard')}catch(z){toast(z.message,true)}}}
function auth(){const q=new URLSearchParams(location.search),reg=q.get('mode')==='register';root.innerHTML=`<section class="page shell"><div class="loginWrap"><div class="authArt"><span class="eyebrow" style="color:#a7e7ce">بقالة</span><h2>خدمات محلية<br>أقرب، أوضح، وأكثر ثقة.</h2><p>أنشئ حسابك لتطلب الخدمة، تراسل مقدمها، تحفظ المفضلة وتقيّم بعد الإنجاز.</p></div><form class="authForm" id="authForm"><span class="eyebrow">${reg?'انضم إلى بقالة':'مرحباً بعودتك'}</span><h1>${reg?'إنشاء حساب جديد':'تسجيل الدخول'}</h1>${reg?'<div class="field"><label>الاسم</label><input name="name" autocomplete="name" required minlength="2"></div><div class="field"><label>المدينة</label><input name="city" autocomplete="address-level2"></div>':''}<div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" autocomplete="${reg?'new-password':'current-password'}" minlength="10" required></div><div id="authMsg"></div><button class="btn primary" style="width:100%">${reg?'إنشاء الحساب':'دخول'}</button><p style="text-align:center;font-size:10px;color:var(--sub);margin-top:15px">${reg?'لديك حساب؟':'ليس لديك حساب؟'} <a href="/auth${reg?'':'?mode=register'}" data-nav style="color:var(--green);font-weight:900">${reg?'سجل الدخول':'أنشئ حساباً'}</a></p></form></div></section>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api('/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify(b)});await loadIdentity();const next=q.get('next');go(next&&next.startsWith('/')?next:'/dashboard')}catch(z){document.getElementById('authMsg').innerHTML=`<div class="error">${esc(z.message)}</div>`}};bindNav()}
function requireLogin(){if(!me){go('/auth');return false}return true}
async function dashboard(){if(!requireLogin())return;const b=await api('/bookings');const active=b.filter(x=>!['COMPLETED','CANCELLED','REJECTED'].includes(x.status));root.innerHTML=`<section class="page shell"><div class="dashHeader"><div><span class="eyebrow">مساحة العمل</span><h1>${me.role==='provider'?'الحجوزات والطلبات':'حجوزاتي'}</h1></div>${me.role==='provider'?'<a class="btn primary" href="/provider" data-nav>لوحة مقدم الخدمة</a>':'<a class="btn primary" href="/services" data-nav>اكتشف خدمة جديدة</a>'}</div><div class="metrics"><div class="metric"><small>إجمالي الحجوزات</small><b>${b.length}</b></div><div class="metric"><small>النشطة الآن</small><b>${active.length}</b></div><div class="metric"><small>المكتملة</small><b>${b.filter(x=>x.status==='COMPLETED').length}</b></div><div class="metric"><small>الملغاة/المرفوضة</small><b>${b.filter(x=>['CANCELLED','REJECTED'].includes(x.status)).length}</b></div></div><div class="panel"><div class="tabs"><button class="tab active" data-book-filter="all">الكل</button><button class="tab" data-book-filter="active">النشطة</button><button class="tab" data-book-filter="completed">المكتملة</button></div><div id="bookingRows">${bookingRows(b)}</div></div></section>`;document.querySelectorAll('[data-book-filter]').forEach(t=>t.onclick=()=>{document.querySelectorAll('[data-book-filter]').forEach(x=>x.classList.remove('active'));t.classList.add('active');const f=t.dataset.bookFilter;document.getElementById('bookingRows').innerHTML=bookingRows(f==='active'?active:f==='completed'?b.filter(x=>x.status==='COMPLETED'):b);bindBookingActions()});bindBookingActions();bindNav()}
function bookingRows(b){return b.length?b.map(x=>`<div class="row"><div class="rowMain"><span class="pill status ${x.status}">${STATUS[x.status]||x.status}</span><b>${esc(x.service_title)}</b><small>${me.role==='provider'?'العميل: '+esc(x.customer_name):'مقدم الخدمة: '+esc(x.provider_name)} · ${date(x.starts_at)} · ${cash(x.price)}</small></div><div class="rowActions">${bookingActions(x)}</div></div>`).join(''):`<div class="empty"><span class="emptyIcon">▣</span>لا توجد حجوزات في هذا القسم.</div>`}
function bookingActions(x){let a=`<button class="btn ghost tiny" data-chat="${x.id}">رسائل</button>`;if(me.role==='provider'){const next=x.status==='PENDING'?'ACCEPTED':x.status==='ACCEPTED'?'CONFIRMED':x.status==='CONFIRMED'?'IN_PROGRESS':x.status==='IN_PROGRESS'?'COMPLETED':null;if(next)a+=`<button class="btn primary tiny" data-status="${next}" data-id="${x.id}">${STATUS[next]}</button>`;if(x.status==='PENDING')a+=`<button class="btn danger tiny" data-status="REJECTED" data-id="${x.id}">رفض</button>`}else{if(['PENDING','ACCEPTED','CONFIRMED'].includes(x.status))a+=`<button class="btn danger tiny" data-status="CANCELLED" data-id="${x.id}">إلغاء</button>`;if(x.status==='COMPLETED'&&!x.reviewed)a+=`<button class="btn primary tiny" data-review="${x.id}">تقييم</button>`;if(['IN_PROGRESS','COMPLETED'].includes(x.status)&&!x.disputed)a+=`<button class="btn ghost tiny" data-dispute="${x.id}">نزاع</button>`}return a}
function bindBookingActions(){document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{let reason='';if(b.dataset.status==='CANCELLED')reason=prompt('سبب الإلغاء (اختياري):')||'';try{await api('/bookings/'+b.dataset.id+'/status',{method:'PATCH',body:JSON.stringify({status:b.dataset.status,reason})});toast('تم تحديث الحجز');dashboard()}catch(z){toast(z.message,true)}});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>go('/messages?booking='+b.dataset.chat));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewModal(b.dataset.review));document.querySelectorAll('[data-dispute]').forEach(b=>b.onclick=()=>disputeModal(b.dataset.dispute))}
function reviewModal(id){const m=modal('قيّم الخدمة',`<form id="reviewForm"><div class="field"><label>التقييم</label><select name="rating"><option value="5">5 — ممتاز</option><option value="4">4 — جيد جداً</option><option value="3">3 — جيد</option><option value="2">2 — مقبول</option><option value="1">1 — ضعيف</option></select></div><div class="field"><label>تعليق اختياري</label><textarea name="comment" placeholder="شارك تجربتك باحترام ووضوح"></textarea></div><button class="btn primary" style="width:100%">إرسال التقييم</button></form>`);m.querySelector('#reviewForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.bookingId=id;f.rating=Number(f.rating);try{await api('/reviews',{method:'POST',body:JSON.stringify(f)});m.remove();toast('شكراً لتقييمك');dashboard()}catch(z){toast(z.message,true)}}}
function disputeModal(id){const m=modal('فتح نزاع',`<form id="disputeForm"><div class="field"><label>سبب النزاع</label><select name="reason"><option>الخدمة غير مكتملة</option><option>جودة الخدمة</option><option>اختلاف على نطاق العمل</option><option>مشكلة في الموعد</option><option>سبب آخر</option></select></div><div class="field"><label>التفاصيل</label><textarea name="description" required></textarea></div><button class="btn primary" style="width:100%">إرسال للمراجعة</button></form>`);m.querySelector('#disputeForm').onsubmit=async e=>{e.preventDefault();try{await api('/bookings/'+id+'/dispute',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});m.remove();toast('تم فتح النزاع');dashboard()}catch(z){toast(z.message,true)}}}
async function favoritesPage(){if(!requireLogin())return;const s=await api('/favorites');root.innerHTML=`<section class="page shell"><div class="dashHeader"><div><span class="eyebrow">محفوظاتك</span><h1>المفضلة</h1></div><a class="btn ghost" href="/services" data-nav>استكشف المزيد</a></div>${serviceCards(s)}</section>`;bindNav();bindFav()}
async function notifications(){if(!requireLogin())return;const n=await api('/notifications');root.innerHTML=`<section class="page shell"><div class="dashHeader"><div><span class="eyebrow">آخر المستجدات</span><h1>الإشعارات</h1></div>${n.some(x=>!x.read_at)?'<button class="btn ghost" id="readAll">تحديد الكل كمقروء</button>':''}</div><div class="panel" style="padding:0">${n.length?n.map(x=>`<div class="notice ${x.read_at?'':'unread'}"><span class="noticeIcon">${noticeIcon(x.kind)}</span><div><b>${esc(x.title)}</b><p>${esc(x.body)}</p><small>${date(x.created_at)}</small></div></div>`).join(''):'<div class="empty">لا توجد إشعارات بعد.</div>'}</div></section>`;document.getElementById('readAll')?.addEventListener('click',async()=>{await api('/notifications/read-all',{method:'PATCH'});notifications()});bindNav()}
function noticeIcon(k){return k?.includes('BOOKING')?'▣':k?.includes('MESSAGE')?'✉':k?.includes('REVIEW')?'★':k?.includes('VERIFICATION')?'✓':'◔'}
async function messages(){if(!requireLogin())return;const b=await api('/bookings'),q=new URLSearchParams(location.search);let selected=q.get('booking')||b[0]?.id;if(selected&&!b.some(x=>x.id===selected))selected=b[0]?.id;root.innerHTML=`<section class="page shell"><span class="eyebrow">تواصل داخل المنصة</span><h1>الرسائل</h1>${b.length?`<div class="chatWrap"><aside class="chatList">${b.map(x=>`<div class="chatItem ${x.id===selected?'active':''}" data-chat-select="${x.id}"><b>${esc(x.service_title)}</b><small>${me.role==='provider'?esc(x.customer_name):esc(x.provider_name)} · ${STATUS[x.status]}</small></div>`).join('')}</aside><section class="chatRoom"><div class="messages" id="messageBox"><div class="skeleton"></div></div><form class="composer" id="composer"><input name="body" autocomplete="off" maxlength="2000" placeholder="اكتب رسالة..."><button class="btn primary">إرسال</button></form></section></div>`:'<div class="empty"><span class="emptyIcon">✉</span>تظهر المحادثات بعد إنشاء أول حجز.</div>'}</section>`;document.querySelectorAll('[data-chat-select]').forEach(x=>x.onclick=()=>go('/messages?booking='+x.dataset.chatSelect));if(selected){await loadMessages(selected);document.getElementById('composer').onsubmit=async e=>{e.preventDefault();const input=e.target.body,body=input.value.trim();if(!body)return;try{await api('/bookings/'+selected+'/messages',{method:'POST',body:JSON.stringify({body})});input.value='';await loadMessages(selected)}catch(z){toast(z.message,true)}};clearInterval(chatTimer);chatTimer=setInterval(()=>{if(location.pathname==='/messages')loadMessages(selected,true)},5000)}bindNav()}
async function loadMessages(id,silent=false){try{const m=await api('/bookings/'+id+'/messages'),box=document.getElementById('messageBox');if(!box)return;box.innerHTML=m.length?m.map(x=>`<div class="bubble ${x.sender_id===me.id?'me':''}">${esc(x.body)}<small>${esc(x.sender_name)} · ${date(x.created_at)}</small></div>`).join(''):'<div class="empty">ابدأ المحادثة برسالة واضحة عن الطلب.</div>';if(!silent)box.scrollTop=box.scrollHeight}catch(z){if(!silent)toast(z.message,true)}}
async function profile(){if(!requireLogin())return;root.innerHTML=`<section class="page shell"><div class="split"><aside class="sideNav">${accountNav('/profile')}</aside><div><span class="eyebrow">إعدادات الحساب</span><h1>الملف الشخصي</h1><form class="panel" id="profileForm" style="max-width:650px"><div class="field"><label>الاسم</label><input name="name" value="${esc(me.name)}" required></div><div class="field"><label>البريد</label><input value="${esc(me.email)}" disabled></div><div class="field"><label>المدينة</label><input name="city" value="${esc(me.city||'')}"></div><button class="btn primary">حفظ التغييرات</button></form></div></div></section>`;document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();try{me=await api('/profile',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('تم حفظ الملف');renderChrome()}catch(z){toast(z.message,true)}};bindNav()}
function accountNav(active){const links=[['/profile','◎','الملف الشخصي'],['/dashboard','▣','الحجوزات'],['/messages','✉','الرسائل'],['/favorites','♡','المفضلة'],['/notifications','◔','الإشعارات']];return links.map(([h,i,t])=>`<a href="${h}" data-nav class="${h===active?'active':''}">${i} ${t}</a>`).join('')+(me?.role==='provider'?'<div class="sep"></div><a href="/provider" data-nav>▥ لوحة مقدم الخدمة</a>':'')}
async function providerDashboard(){if(!requireLogin())return;if(me.role!=='provider'&&me.role!=='admin')return providerOnboard();const [p,s,b,v]=await Promise.all([api('/provider/me'),api('/provider/services'),api('/bookings'),api('/provider/verification')]);root.innerHTML=`<section class="page shell"><div class="dashHeader"><div><span class="eyebrow">أعمالك على بقالة</span><h1>لوحة مقدم الخدمة</h1></div><div style="display:flex;gap:8px"><a class="btn ghost" href="/provider/availability" data-nav>التوفر والمواعيد</a><button class="btn primary" id="newService">+ خدمة جديدة</button></div></div><div class="metrics"><div class="metric"><small>الخدمات</small><b>${s.filter(x=>x.status==='ACTIVE').length}</b></div><div class="metric"><small>طلبات معلقة</small><b>${b.filter(x=>x.status==='PENDING').length}</b></div><div class="metric"><small>خدمات مكتملة</small><b>${p.completed||0}</b></div><div class="metric"><small>التقييم</small><b>${Number(p.rating||0).toFixed(1)} ★</b></div></div><div class="grid2"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>خدماتي</h3><span class="pill ${p.verified?'':'gray'}">${p.verified?'✓ موثّق':'غير موثّق'}</span></div>${s.length?s.map(x=>`<div class="row"><div class="rowMain"><span class="pill gray">${esc(x.status)}</span><b>${esc(x.title)}</b><small>${esc(categoryName(x.category))} · ${cash(x.price)}</small></div><div class="rowActions"><button class="btn ghost tiny" data-edit-service="${x.id}">تعديل</button>${x.status==='ACTIVE'?`<button class="btn danger tiny" data-archive="${x.id}">أرشفة</button>`:`<button class="btn secondary tiny" data-activate="${x.id}">تفعيل</button>`}</div></div>`).join(''):'<div class="empty">أضف أول خدمة لتظهر في السوق.</div>'}</div><div class="panel"><h3>التوثيق</h3><p style="font-size:11px;color:var(--sub)">حالة الحساب: <b>${esc(p.verification_status||'NOT_SUBMITTED')}</b></p>${v[0]?`<div class="note">آخر طلب: ${esc(v[0].status)} · ${shortDate(v[0].submitted_at)}${v[0].admin_note?'<br>'+esc(v[0].admin_note):''}</div>`:''}${!['PENDING','UNDER_REVIEW'].includes(p.verification_status)?'<button class="btn secondary" id="verifyRequest">طلب التوثيق</button>':''}<p style="font-size:9px;color:var(--sub);margin-top:12px">رفع المستندات الخاصة يحتاج ربط Object Storage خاص؛ لا ننشر مستندات التوثيق عبر روابط عامة.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>بيانات الملف</h3><p style="font-size:11px"><b>${esc(p.title)}</b><br>${esc(p.city)} ${p.district?'· '+esc(p.district):''}</p><button class="btn ghost tiny" id="editProvider">تعديل الملف</button></div></div></section>`;document.getElementById('newService').onclick=()=>serviceModal(null);document.querySelectorAll('[data-edit-service]').forEach(x=>x.onclick=()=>serviceModal(s.find(y=>y.id===x.dataset.editService)));document.querySelectorAll('[data-archive]').forEach(x=>x.onclick=()=>changeService(x.dataset.archive,'ARCHIVED'));document.querySelectorAll('[data-activate]').forEach(x=>x.onclick=()=>changeService(x.dataset.activate,'ACTIVE'));document.getElementById('verifyRequest')?.addEventListener('click',()=>verificationModal());document.getElementById('editProvider').onclick=()=>providerEditModal(p);bindNav()}
function providerOnboard(){root.innerHTML=`<section class="page shell"><div class="loginWrap"><div class="authArt"><span class="eyebrow" style="color:#a7e7ce">نمّي عملك محلياً</span><h2>حوّل مهارتك إلى خدمة قابلة للحجز.</h2><p>أضف تخصصك ومدينتك وخدماتك وأوقات عملك، ثم أدر الطلبات والمحادثات من لوحة واحدة.</p></div><form class="authForm" id="onboard"><span class="eyebrow">الانضمام كمقدم خدمة</span><h1>أنشئ ملفك المهني</h1><div class="field"><label>المسمى المهني</label><input name="title" required placeholder="مثال: فني كهرباء منازل"></div><div class="field"><label>المدينة</label><input name="city" required></div><div class="field"><label>الحي / المنطقة</label><input name="district"></div><div class="field"><label>نبذة مختصرة</label><textarea name="bio" placeholder="خبرتك ونوع الأعمال التي تنفذها"></textarea></div><button class="btn primary" style="width:100%">إنشاء ملف مقدم الخدمة</button></form></div></section>`;document.getElementById('onboard').onsubmit=async e=>{e.preventDefault();try{await api('/provider/onboard',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await loadIdentity();toast('تم إنشاء ملف مقدم الخدمة');providerDashboard()}catch(z){toast(z.message,true)}}}
async function changeService(id,status){try{await api('/services/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('تم تحديث الخدمة');providerDashboard()}catch(z){toast(z.message,true)}}
async function serviceModal(s){const cats=await api('/categories'),m=modal(s?'تعديل الخدمة':'إضافة خدمة',`<form id="serviceForm"><div class="field"><label>اسم الخدمة</label><input name="title" value="${esc(s?.title||'')}" required></div><div class="field"><label>التصنيف</label><select name="category">${cats.map(x=>`<option value="${x.slug}" ${s?.category===x.slug?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الوصف</label><textarea name="description" required>${esc(s?.description||'')}</textarea></div><div class="grid2"><div class="field"><label>السعر</label><input name="price" type="number" min="0" value="${s?.price??''}"></div><div class="field"><label>المدة بالدقائق</label><input name="duration" type="number" min="15" value="${s?.duration||60}"></div></div><div class="grid2"><div class="field"><label>التسعير</label><select name="pricing"><option value="FIXED" ${s?.pricing==='FIXED'?'selected':''}>سعر ثابت</option><option value="STARTING_FROM" ${!s||s?.pricing==='STARTING_FROM'?'selected':''}>يبدأ من</option><option value="HOURLY" ${s?.pricing==='HOURLY'?'selected':''}>بالساعة</option><option value="NEGOTIABLE" ${s?.pricing==='NEGOTIABLE'?'selected':''}>قابل للتفاوض</option></select></div><div class="field"><label>مكان الخدمة</label><select name="locationType"><option value="CUSTOMER_LOCATION" ${!s||s?.location_type==='CUSTOMER_LOCATION'?'selected':''}>موقع العميل</option><option value="PROVIDER_LOCATION" ${s?.location_type==='PROVIDER_LOCATION'?'selected':''}>موقع مقدم الخدمة</option><option value="ONLINE" ${s?.location_type==='ONLINE'?'selected':''}>أونلاين</option><option value="HYBRID" ${s?.location_type==='HYBRID'?'selected':''}>مرن</option></select></div></div><button class="btn primary" style="width:100%">${s?'حفظ التعديلات':'نشر الخدمة'}</button></form>`);m.querySelector('#serviceForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.duration=Number(f.duration);f.price=f.price===''?null:Number(f.price);try{await api(s?'/services/'+s.id:'/services',{method:s?'PATCH':'POST',body:JSON.stringify(f)});m.remove();toast(s?'تم تعديل الخدمة':'تم نشر الخدمة');providerDashboard()}catch(z){toast(z.message,true)}}}
function verificationModal(){const m=modal('طلب توثيق الحساب',`<form id="verifyForm"><div class="field"><label>ملاحظات للمراجع</label><textarea name="note" placeholder="اذكر معلومات تساعد في مراجعة خبرتك أو نشاطك"></textarea></div><div class="note">المستندات الحساسة لا ينبغي رفعها إلى رابط عام. عند ربط التخزين الخاص ستظهر هنا أداة رفع آمنة.</div><button class="btn primary" style="width:100%">إرسال الطلب</button></form>`);m.querySelector('#verifyForm').onsubmit=async e=>{e.preventDefault();try{await api('/provider/verification',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});m.remove();toast('تم إرسال طلب التوثيق');providerDashboard()}catch(z){toast(z.message,true)}}}
function providerEditModal(p){const m=modal('تعديل الملف المهني',`<form id="pedit"><div class="field"><label>المسمى المهني</label><input name="title" value="${esc(p.title)}" required></div><div class="field"><label>المدينة</label><input name="city" value="${esc(p.city)}" required></div><div class="field"><label>المنطقة</label><input name="district" value="${esc(p.district||'')}"></div><div class="field"><label>النبذة</label><textarea name="bio">${esc(p.bio||'')}</textarea></div><button class="btn primary" style="width:100%">حفظ</button></form>`);m.querySelector('#pedit').onsubmit=async e=>{e.preventDefault();try{await api('/provider/me',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});m.remove();toast('تم تحديث الملف');providerDashboard()}catch(z){toast(z.message,true)}}}
async function availability(){if(!requireLogin())return;if(me.role!=='provider'&&me.role!=='admin')return go('/provider');const a=await api('/provider/availability'),days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];const by=new Map(a.weekly.map(x=>[Number(x.weekday),x]));root.innerHTML=`<section class="page shell"><div class="dashHeader"><div><span class="eyebrow">إدارة الوقت</span><h1>التوفر والمواعيد</h1></div><a class="btn ghost" href="/provider" data-nav>رجوع للوحة</a></div><div class="grid2"><form class="panel" id="schedule"><h3>أيام وساعات العمل</h3><p style="font-size:10px;color:var(--sub)">المنطقة الزمنية: ${esc(a.timezone||'Asia/Aden')}</p><div class="schedule">${days.map((d,i)=>{const r=by.get(i);return `<div class="day"><label>${d}</label><input name="start${i}" type="time" value="${esc((r?.start_time||'09:00').slice(0,5))}"><input name="end${i}" type="time" value="${esc((r?.end_time||'17:00').slice(0,5))}"><label class="switch"><input name="on${i}" type="checkbox" ${r?.enabled?'checked':''}> متاح</label></div>`}).join('')}</div><button class="btn primary" style="margin-top:14px">حفظ الجدول</button></form><div class="panel"><h3>أيام غير متاحة</h3><form id="offForm"><div class="field"><label>التاريخ</label><input name="date" type="date" required></div><div class="field"><label>ملاحظة</label><input name="note" placeholder="إجازة، ارتباط آخر..."></div><button class="btn secondary">إضافة اليوم</button></form><div style="margin-top:16px">${a.unavailableDates.length?a.unavailableDates.map(x=>`<div class="row"><div class="rowMain"><b>${shortDate(x.date)}</b><small>${esc(x.note||'غير متاح')}</small></div><button class="btn danger tiny" data-off-delete="${x.id}">حذف</button></div>`).join(''):'<div class="empty">لا توجد إجازات مستقبلية مسجلة.</div>'}</div></div></div></section>`;document.getElementById('schedule').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),weekly=days.map((_,i)=>({weekday:i,startTime:f.get('start'+i),endTime:f.get('end'+i),enabled:!!f.get('on'+i)})).filter(x=>x.enabled);try{await api('/provider/availability',{method:'PUT',body:JSON.stringify({weekly})});toast('تم حفظ جدول التوفر');availability()}catch(z){toast(z.message,true)}};document.getElementById('offForm').onsubmit=async e=>{e.preventDefault();try{await api('/provider/unavailable-dates',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('تمت إضافة اليوم');availability()}catch(z){toast(z.message,true)}};document.querySelectorAll('[data-off-delete]').forEach(x=>x.onclick=async()=>{await api('/provider/unavailable-dates/'+x.dataset.offDelete,{method:'DELETE'});availability()});bindNav()}
async function admin(){if(!requireLogin())return;if(me.role!=='admin')return go('/dashboard');const [s,u,v,d,r]=await Promise.all([api('/admin/stats'),api('/admin/users'),api('/admin/verifications'),api('/admin/disputes'),api('/admin/reports')]);root.innerHTML=`<section class="page shell"><div class="dashHeader"><div><span class="eyebrow">مركز التشغيل</span><h1>لوحة الإدارة</h1></div><span class="pill">Production</span></div><div class="metrics"><div class="metric"><small>المستخدمون</small><b>${s.users}</b></div><div class="metric"><small>مقدمو الخدمة</small><b>${s.providers}</b></div><div class="metric"><small>الخدمات النشطة</small><b>${s.services}</b></div><div class="metric"><small>الحجوزات</small><b>${s.bookings}</b></div></div><div class="metrics"><div class="metric"><small>المكتملة</small><b>${s.completed}</b></div><div class="metric"><small>نزاعات مفتوحة</small><b>${s.disputes}</b></div><div class="metric"><small>بلاغات مفتوحة</small><b>${s.reports}</b></div><div class="metric"><small>توثيق ينتظر</small><b>${s.verifications}</b></div></div><div class="tabs"><button class="tab active" data-admin-tab="users">المستخدمون</button><button class="tab" data-admin-tab="verification">التوثيق (${v.length})</button><button class="tab" data-admin-tab="disputes">النزاعات (${d.length})</button><button class="tab" data-admin-tab="reports">البلاغات (${r.length})</button></div><div id="adminBody">${adminUsers(u)}</div></section>`;const data={users:adminUsers(u),verification:adminVerifications(v),disputes:adminDisputes(d),reports:adminReports(r)};document.querySelectorAll('[data-admin-tab]').forEach(t=>t.onclick=()=>{document.querySelectorAll('[data-admin-tab]').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('adminBody').innerHTML=data[t.dataset.adminTab];bindAdminActions()});bindAdminActions()}
function adminUsers(u){return `<div class="panel tableScroll"><table class="adminTable"><thead><tr><th>المستخدم</th><th>الدور</th><th>المدينة</th><th>الحالة</th><th>تاريخ الانضمام</th><th>إجراء</th></tr></thead><tbody>${u.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.email)}</small></td><td>${esc(x.role)}</td><td>${esc(x.city||'—')}</td><td><span class="pill ${x.status==='ACTIVE'?'':'dangerP'}">${esc(x.status)}</span></td><td>${shortDate(x.created_at)}</td><td><select data-user-status="${x.id}"><option value="ACTIVE" ${x.status==='ACTIVE'?'selected':''}>ACTIVE</option><option value="SUSPENDED" ${x.status==='SUSPENDED'?'selected':''}>SUSPENDED</option><option value="BANNED" ${x.status==='BANNED'?'selected':''}>BANNED</option></select></td></tr>`).join('')}</tbody></table></div>`}
function adminVerifications(v){return `<div class="panel">${v.length?v.map(x=>`<div class="row"><div class="rowMain"><span class="pill ${x.status==='APPROVED'?'':'warn'}">${esc(x.status)}</span><b>${esc(x.provider_name)} — ${esc(x.title)}</b><small>${esc(x.email)} · ${shortDate(x.submitted_at)}${x.provider_note?' · '+esc(x.provider_note):''}</small></div><div class="rowActions">${!['APPROVED','REJECTED'].includes(x.status)?`<button class="btn secondary tiny" data-verify="${x.id}" data-vstatus="APPROVED">موافقة</button><button class="btn danger tiny" data-verify="${x.id}" data-vstatus="REJECTED">رفض</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد طلبات توثيق.</div>'}</div>`}
function adminDisputes(d){return `<div class="panel">${d.length?d.map(x=>`<div class="row"><div class="rowMain"><span class="pill warn">${esc(x.status)}</span><b>${esc(x.service_title)}</b><small>${esc(x.customer_name)} ↔ ${esc(x.provider_name)} · ${esc(x.reason)}</small></div><div class="rowActions">${!['RESOLVED','REJECTED'].includes(x.status)?`<button class="btn secondary tiny" data-dispute-admin="${x.id}" data-dstatus="RESOLVED">حل</button><button class="btn danger tiny" data-dispute-admin="${x.id}" data-dstatus="REJECTED">رفض</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد نزاعات.</div>'}</div>`}
function adminReports(r){return `<div class="panel">${r.length?r.map(x=>`<div class="row"><div class="rowMain"><span class="pill warn">${esc(x.status)}</span><b>${esc(x.target_type)} — ${esc(x.reason)}</b><small>المبلّغ: ${esc(x.reporter_name)} · ${shortDate(x.created_at)}</small></div><div class="rowActions">${x.status==='OPEN'?`<button class="btn secondary tiny" data-report="${x.id}" data-rstatus="RESOLVED">إغلاق</button><button class="btn danger tiny" data-report="${x.id}" data-rstatus="REJECTED">رفض</button>`:''}</div></div>`).join(''):'<div class="empty">لا توجد بلاغات.</div>'}</div>`}
function bindAdminActions(){document.querySelectorAll('[data-user-status]').forEach(x=>x.onchange=async()=>{try{await api('/admin/users/'+x.dataset.userStatus+'/status',{method:'PATCH',body:JSON.stringify({status:x.value})});toast('تم تحديث المستخدم')}catch(z){toast(z.message,true);admin()}});document.querySelectorAll('[data-verify]').forEach(x=>x.onclick=async()=>{const note=prompt('ملاحظة للمقدم (اختياري):')||'';try{await api('/admin/verifications/'+x.dataset.verify,{method:'PATCH',body:JSON.stringify({status:x.dataset.vstatus,note})});toast('تم تحديث التوثيق');admin()}catch(z){toast(z.message,true)}});document.querySelectorAll('[data-dispute-admin]').forEach(x=>x.onclick=async()=>{const response=prompt('قرار الإدارة / الملاحظة:')||'';try{await api('/admin/disputes/'+x.dataset.disputeAdmin,{method:'PATCH',body:JSON.stringify({status:x.dataset.dstatus,response})});toast('تم تحديث النزاع');admin()}catch(z){toast(z.message,true)}});document.querySelectorAll('[data-report]').forEach(x=>x.onclick=async()=>{try{await api('/admin/reports/'+x.dataset.report,{method:'PATCH',body:JSON.stringify({status:x.dataset.rstatus})});toast('تم تحديث البلاغ');admin()}catch(z){toast(z.message,true)}})}
async function render(){clearInterval(chatTimer);chatTimer=null;window.scrollTo({top:0,behavior:'instant'});try{await loadIdentity();const p=location.pathname;if(p==='/')return home();if(p==='/services')return services();if(p==='/providers')return providers();if(p.startsWith('/provider-profile/'))return providerProfile(p.split('/')[2]);if(p.startsWith('/service/'))return serviceDetail(p.split('/')[2]);if(p==='/auth')return auth();if(p==='/dashboard')return dashboard();if(p==='/favorites')return favoritesPage();if(p==='/notifications')return notifications();if(p==='/messages')return messages();if(p==='/profile')return profile();if(p==='/provider')return providerDashboard();if(p==='/provider/availability')return availability();if(p==='/admin')return admin();return notFound()}catch(z){root.innerHTML=`<section class="page shell"><div class="empty"><span class="emptyIcon">!</span><b>تعذر تحميل الصفحة</b><br>${esc(z.message)}<br><button class="btn primary" style="margin-top:12px" onclick="render()">إعادة المحاولة</button></div></section>`;console.error(z)}}
function notFound(){root.innerHTML=`<section class="page shell"><div class="empty"><span class="emptyIcon">404</span>الصفحة غير موجودة.<br><a href="/" data-nav class="btn primary" style="margin-top:12px">العودة للرئيسية</a></div></section>`;bindNav()}
window.onpopstate=render;render();
</script>
</body>
</html>
